[package]
name = "nmd-core"
version = "1.0.1"
authors = ["Nicola Ricciardi"]
edition = "2024"
description = "Official NMD compiler core"
readme = "README.md"
repository = "https://github.com/nricciardi/nmd-core"
license-file = "LICENSE"
keywords = ["compiler", "nmd", "markdown"]
exclude = [
    "test-resources/*",
    "logo/*",
    "doc/*"
]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
ahash = "0.8.11"
anyhow = "1.0.75"
base64 = "0.22.1"
build_html = "2.5.0"
delegate = "0.13.2"
env_logger = "0.11.7"
getset = "0.1.2"
indexmap = { version = "2.4.0", features = ["rayon"]}
infer = "0.19.0"
log = "0.4.20"
once_cell = "1.19.0"
oxipng = { version = "9.1.1", features = ["parallel"]}
rayon = "1.8.0"
regex = "1.10.2"
reqwest = { version = "0.11.24", features = ["blocking"] }
serde = { version = "1.0.195", features = ["derive"] }
serde_json = "1.0.113"
serde_yaml = "0.9.31"
simple_logger = "5.0.0"
thiserror = "2.0.12"
url = "2.5.0"

[dev-dependencies]
criterion = { version = "0.5.1", features = ["html_reports"] }

[profile.profiling]
inherits = "release"
debug = true
